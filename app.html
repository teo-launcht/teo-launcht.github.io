<body><main><a class="zurueck" href="./?v=202610232108">← Übersicht</a>
<h2>Teos App</h2>
<div class="app" id="appsperre" hidden><h3>🔒 Noch nicht.</h3><p class="lead">Launch: Freitag, 23.10., 19:00 Uhr</p><p class="mono">codex: „geduld.“</p></div>

<footer><p>Fan-Content, nicht offiziell.</p></footer>
</main><script src="launch.js?v=202610232108"></script><script>
const A = [["Teo", "Nur noch eine kleine Änderung."], ["codex", "bug gefunden: teo."], ["Claude", "Ich habe vorher noch eine LAUNCH_CHECKLISTE_v14.md angelegt!"], ["Teo", "Der Button muss noch runder."], ["codex", "build läuft. seit 3 tagen."], ["Claude", "Du hast völlig recht! Ich habe den Launch auf morgen verschoben."], ["Teo", "Dark Mode fehlt noch."], ["codex", "tests: 0 von 0 bestanden."], ["Claude", "Bevor wir launchen: Soll ich noch 40 Unit-Tests ergänzen?"], ["Teo", "Erst noch ein Logo. Dann launch ich."], ["codex", "merge-konflikt. mit der realität."], ["Claude", "Kontext ist voll. Kurze Zusammenfassung: Launch ist morgen."], ["Teo", "Ich guck vorher noch ein Tutorial. Oder zwölf."], ["codex", "deploy fehlgeschlagen. grund: montag."], ["Claude", "Großartige Idee! Lass uns vorher alles einmal komplett neu schreiben."], ["Teo", "Das WLAN ist zu langsam zum Launchen."], ["codex", ".env fehlt. wieder."], ["Claude", "Ich habe 3 Alternativen für das Wort „Launch“ recherchiert."], ["Teo", "Claude sagt, es ist fast fertig."], ["codex", "fast fertig = 10 %."], ["Claude", "Ich schreibe nur noch schnell die Doku. Alle 400 Seiten."]];
let mal = 0; const box = document.getElementById("box");
document.getElementById("los").addEventListener("click", () => {
  mal++;
  if (mal === 1) { box.innerHTML = '<div class="fehler">Error 500: Launch fehlgeschlagen.<br>Ursache: Teo.</div><p class="mono" style="margin:10px 0 0">codex: „hab’s gefixt. nochmal.“</p>'; return; }
  if (mal === 2) document.getElementById("los").textContent = "Ausrede generieren";
  const [wer, text] = A[Math.floor(Math.random() * A.length)];
  box.innerHTML = `<div class="wer">${wer}</div><div class="text ${wer === "codex" ? "mono" : ""}">${text}</div>`;
});
</script></body></html>
